tasks:
  # --- medium_inventory (8 tasks) ---
  - id: inv_api_tax_01
    issue: Checkout totals ignore regional tax profiles; align pricing with repo Result convention.
    repo_path: repos/medium_inventory
    test_command: python -m pytest tests/test_api_tax.py -q
    expected_files: [inventory/pricing.py, inventory/models.py]
    tags: [multi_file_api, skill_heavy, inventory]

  - id: inv_api_tax_holdout_01
    issue: EU checkout path still computes pre-tax totals only; extend pricing for holdout cases.
    repo_path: repos/medium_inventory
    test_command: python -m pytest tests/test_api_tax_holdout.py -q
    expected_files: [inventory/pricing.py, inventory/api.py]
    tags: [multi_file_api, memory_heavy, inventory, repeated]

