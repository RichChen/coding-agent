# Baseline + L1 micro-compact with token threshold (single-variable A/B vs baseline.yaml).
llm:
  base_url: "${LLM_BASE_URL:https://api.deepseek.com/v1}"
  api_key: "${LLM_API_KEY}"
  model: "${LLM_MODEL:deepseek-v4-pro}"
  temperature: 0.0
  max_tokens: 4096

runtime:
  max_steps: 30
  step_timeout_seconds: 120
  total_timeout_seconds: 600
  system_prompt_path: prompts/system_default.md
  context:
    micro_compact: true
    keep_recent_tool_results: 3
    compact_token_threshold: 6000

retry:
  max_retries: 2
  backoff_base_seconds: 1.0
  backoff_factor: 2.0
  retry_on:
    - timeout
    - model_error

policy:
  sandbox:
    deny_absolute_paths: true
    deny_parent_traversal: true
    workspace_root: null

  command:
    allow_all: true
    allowed_prefixes: []
    blocked_patterns:
      - "rm -rf /"
      - "sudo "
      - "> /dev/sda"

  file_size_limit_bytes: 1048576
  tool_output_max_chars: 50000
  read_file_max_lines: null

tools:
  enabled:
    - read_file
    - write_file
    - list_dir

tracing:
  format: jsonl
  output_dir: traces
  lifecycle_events: false
