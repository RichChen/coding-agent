# Baseline config — permissive, no command restrictions (model B variant for matrix eval)
llm:
  base_url: "${LLM_BASE_URL:https://api.deepseek.com/v1}"
  api_key: "${LLM_API_KEY}"
  model: "${LLM_MODEL_B:deepseek-chat}"
  temperature: 0.0
  max_tokens: 4096

runtime:
  max_steps: 40
  step_timeout_seconds: 240
  total_timeout_seconds: 1200
  system_prompt_path: prompts/system_default.md
  context:
    micro_compact: false
    keep_recent_tool_results: 3

retry:
  max_retries: 2
  backoff_base_seconds: 1.0
  backoff_factor: 2.0
  retry_on:
    - timeout
    - model_error

policy:
  sandbox:
    deny_absolute_paths: true
    deny_parent_traversal: true
    workspace_root: null  # set at runtime

  command:
    allow_all: true
    allowed_prefixes: []
    blocked_patterns:
      - "rm -rf /"
      - "sudo "
      - "> /dev/sda"
    timeout_seconds: 180

  file_size_limit_bytes: 1048576  # 1MB
  tool_output_max_chars: 50000
  read_file_max_lines: null  # no limit by default

tools:
  enabled:
    - read_file
    - write_file
    - list_dir
    - run_command
    - edit_file

tracing:
  format: jsonl
  output_dir: traces
  lifecycle_events: false
